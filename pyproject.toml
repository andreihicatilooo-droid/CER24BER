[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerber-bot"
version = "0.1.0"
description = "Telegram storefront bot for CERBER"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4.0",
    "aiohttp>=3.9,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1,<3.0",
]

[project.optional-dependencies]
proxy = [
    "aiohttp-socks>=0.8,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]