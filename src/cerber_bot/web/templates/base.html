<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}CERBER{% endblock %}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Matrix rain -->
    <div class="signal-rain" aria-hidden="true" data-signal-rain></div>

    <script>
    (function() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initData) {
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        }
    })();
    </script>

    {% if session and session.get('telegram_id') %}
    <!-- Header (desktop) -->
    <header class="site-header">
        <div class="shell header-row">
            <a class="brand" href="/store">
                <span class="brand-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="9" r="5" stroke="#cc0018" stroke-width="1.6"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#cc0018" stroke-width="1.6" stroke-linecap="square"/>
                        <line x1="4" y1="20" x2="20" y2="20" stroke="#cc0018" stroke-width="1.6"/>
                    </svg>
                </span>
                <span class="brand-copy">
                    <strong>CERBER</strong>
                    <span>dark / encrypted / secure</span>
                </span>
            </a>

            <nav class="header-nav">
                <a href="/store" data-path="/store">Магазин</a>
                <a href="/wallet" data-path="/wallet">Кошелёк</a>
                <a href="/orders" data-path="/orders">Заказы</a>
                <a href="/deals" data-path="/deals">Сделки</a>
                <a href="/profile" data-path="/profile">Профиль</a>
                <a href="/logout">Выход</a>
            </nav>

            <div class="header-tools">
                {% if balance is defined %}
                <div class="balance-chip">
                    <i>₮</i>
                    <div>
                        <strong>{{ "%.2f"|format(balance) }}</strong>
                        <span>Баланс</span>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Bottom dock (mobile) -->
    <nav class="mobile-dock" id="mobileDock">
        <a href="/store" class="dock-item" data-path="/store">
            <span class="dock-icon">▣</span>Магазин
        </a>
        <a href="/wallet" class="dock-item" data-path="/wallet">
            <span class="dock-icon">◈</span>Кошелёк
        </a>
        <a href="/orders" class="dock-item" data-path="/orders">
            <span class="dock-icon">≡</span>Заказы
        </a>
        <a href="/deals" class="dock-item" data-path="/deals">
            <span class="dock-icon">⟐</span>Сделки
        </a>
        <a href="/profile" class="dock-item" data-path="/profile">
            <span class="dock-icon">◉</span>Профиль
        </a>
    </nav>
    {% endif %}

    <main class="fade-in">
        <div class="page-shell">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
    (function () {
        /* ── Matrix rain ────────────────────────────────────── */
        var CHARSET = '01アイウエカキクサシスタチツナニヌネハヒフヘマミムメラリルレ#$%*<>[]{}|_/\\!?NULLVOID';
        function buildSignal(len) {
            return Array.from({ length: len }, function () {
                return CHARSET[Math.floor(Math.random() * CHARSET.length)];
            }).join('\n');
        }
        function renderSignalRain(layer) {
            if (!(layer instanceof HTMLElement)) return;
            layer.innerHTML = '';
            var cols = window.innerWidth < 760 ? 16 : 28;
            for (var i = 0; i < cols; i++) {
                var col = document.createElement('div');
                var len = 18 + Math.floor(Math.random() * 22);
                col.className = 'signal-column' + (i % 7 === 0 ? ' is-amber' : '');
                col.textContent = buildSignal(len);
                col.style.left = (2 + i * (96 / cols)) + '%';
                col.style.animationDuration = (7 + Math.random() * 9) + 's';
                col.style.animationDelay = (-1 * Math.random() * 14) + 's';
                col.style.opacity = (0.18 + Math.random() * 0.24).toFixed(2);
                layer.appendChild(col);
            }
        }
        var rainTimer;
        function scheduleRain() {
            clearTimeout(rainTimer);
            rainTimer = setTimeout(function () {
                document.querySelectorAll('[data-signal-rain]').forEach(renderSignalRain);
            }, 120);
        }
        document.querySelectorAll('[data-signal-rain]').forEach(renderSignalRain);
        window.addEventListener('resize', scheduleRain);

        /* ── Active nav highlight ───────────────────────────── */
        var path = location.pathname;
        document.querySelectorAll('[data-path]').forEach(function (el) {
            var dp = el.getAttribute('data-path');
            if (path === dp || (dp !== '/' && path.startsWith(dp + '/'))) {
                el.classList.add('is-active');
            }
        });
    })();
    </script>
</body>
</html>
