<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}CERBER{% endblock %}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cerber: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            300: '#86efac', 400: '#4ade80', 500: '#22c55e',
                            600: '#16a34a', 700: '#15803d', 800: '#166534',
                            900: '#14532d', 950: '#052e16',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <script>
    (function() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initData) {
            document.body.classList.add('tg-mini-app');
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#030712');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#030712');
        }
    })();
    </script>
    {% if session and session.get('telegram_id') %}
    <!-- Top nav for desktop / fallback browser -->
    <nav class="bg-gray-900/95 border-b border-gray-800 sticky top-0 z-50 nav-desktop backdrop-blur-sm">
        <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <a href="/store" class="text-lg font-bold text-cerber-400 tracking-tight">CERBER</a>
            <div class="flex items-center gap-3 text-sm">
                <a href="/store" class="hover:text-cerber-400 transition-colors">Магазин</a>
                <a href="/wallet" class="hover:text-cerber-400 transition-colors">Кошелёк</a>
                <a href="/orders" class="hover:text-cerber-400 transition-colors">Заказы</a>
                <a href="/deals" class="hover:text-cerber-400 transition-colors">Сделки</a>
                <a href="/profile" class="hover:text-cerber-400 transition-colors">Профиль</a>
                <a href="/logout" class="text-gray-500 hover:text-red-400 transition-colors ml-1">Выход</a>
            </div>
        </div>
    </nav>

    <!-- Bottom tab bar for Mini App -->
    <nav class="nav-bottom fixed bottom-0 left-0 right-0 z-50 border-t" id="bottomNav">
        <div class="flex items-stretch justify-around">
            <a href="/store" class="tab-item flex-1 flex flex-col items-center py-2 text-[10px]"
               data-path="/store">
                <span class="text-lg leading-none mb-0.5">🏪</span>Магазин
            </a>
            <a href="/wallet" class="tab-item flex-1 flex flex-col items-center py-2 text-[10px]"
               data-path="/wallet">
                <span class="text-lg leading-none mb-0.5">💰</span>Кошелёк
            </a>
            <a href="/orders" class="tab-item flex-1 flex flex-col items-center py-2 text-[10px]"
               data-path="/orders">
                <span class="text-lg leading-none mb-0.5">📋</span>Заказы
            </a>
            <a href="/deals" class="tab-item flex-1 flex flex-col items-center py-2 text-[10px]"
               data-path="/deals">
                <span class="text-lg leading-none mb-0.5">🤝</span>Сделки
            </a>
            <a href="/profile" class="tab-item flex-1 flex flex-col items-center py-2 text-[10px]"
               data-path="/profile">
                <span class="text-lg leading-none mb-0.5">👤</span>Профиль
            </a>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-3xl mx-auto px-3 py-4 pb-20 fade-in">
        {% block content %}{% endblock %}
    </main>

    {% if session and session.get('telegram_id') %}
    <script>
    (function() {
        // Highlight active tab
        var path = location.pathname;
        document.querySelectorAll('.tab-item').forEach(function(el) {
            var dp = el.getAttribute('data-path');
            if (path === dp || path.startsWith(dp + '/')) {
                el.classList.add('tab-active');
            }
        });
    })();
    </script>
    {% endif %}
</body>
</html>
